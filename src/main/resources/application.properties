spring.application.name=lending-application

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/lending_app}
spring.datasource.username=${DB_USER:lending_user}
spring.datasource.password=${DB_PASSWORD:lending_password}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration